[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-evidence"
version = "0.2.0"
description = "Reference tooling for the AI Evidence Manifest: a static /ai.json file linking website claims to the first-party evidence supporting them."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Dominion Labs, Inc.", email = "info@dmnlabs.org" }]
keywords = ["ai", "evidence", "provenance", "manifest", "agents", "json-schema"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "html5lib>=1.1",
  "jsonschema[format]>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/DominionLabsInc/ai-evidence-manifest"
Specification = "https://github.com/DominionLabsInc/ai-evidence-manifest/blob/main/SPEC.md"
Issues = "https://github.com/DominionLabsInc/ai-evidence-manifest/issues"

[project.scripts]
ai-evidence = "ai_evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_evidence"]

[tool.hatch.build.targets.wheel.force-include]
"../schema/ai-evidence-manifest.schema.json" = "ai_evidence/ai-evidence-manifest.schema.json"
"../shared/patterns.json" = "ai_evidence/patterns.json"
"../LICENSE" = "ai_evidence/LICENSE"
"../NOTICE" = "ai_evidence/NOTICE"
